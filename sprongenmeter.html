<title>Sprongenmeter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&display=swap">
<style>
/* Layout: Braun-style instrument panel. Spec strip, round dial, frequency-scale ruler, then ten rows. One orange accent. */
:root {
  --bg: #E7E6E1;
  --panel: #F3F2EE;
  --ink: #1B1B19;
  --mute: #6B6A64;
  --line: #C6C5BF;
  --accent: #E2520F;
  --accent-ink: #FFFFFF;
  --font: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1B1A; --panel: #252523; --ink: #ECEBE5; --mute: #9C9B93;
    --line: #3C3C39; --accent: #F2692B; --accent-ink: #1B1B1A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1B1A; --panel: #252523; --ink: #ECEBE5; --mute: #9C9B93;
  --line: #3C3C39; --accent: #F2692B; --accent-ink: #1B1B1A; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 980px; margin: 0 auto;
  padding-block: 32px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px;
}
.wrap > * { min-width: 0; }
.label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.num { font-variant-numeric: tabular-nums; }

header { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); line-height: 1; font-weight: 800; letter-spacing: -.02em; }
header .label { padding-bottom: 4px; }

/* spec strip */
.specs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.spec { padding: 14px 16px 14px 0; min-width: 0; display: grid; gap: 4px; align-content: start; }
.spec + .spec { padding-left: 16px; border-left: 1px solid var(--line); }
.spec b { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.spec small { color: var(--mute); font-size: 13px; }
@media (max-width: 640px) {
  .specs { grid-template-columns: 1fr 1fr; }
  .spec:nth-child(3) { padding-left: 0; border-left: 0; }
  .spec:nth-child(n+3) { border-top: 1px solid var(--line); }
}

/* dial + status */
.now { display: grid; grid-template-columns: 220px 1fr; gap: 32px; align-items: center; background: var(--panel); padding: 28px; }
@media (max-width: 640px) { .now { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 24px 16px; } }
.dial { width: 100%; max-width: 220px; height: auto; display: block; }
.dial .tick { stroke: var(--mute); stroke-width: 1; }
.dial .tick.k { stroke: var(--ink); stroke-width: 1.6; }
.dial .tick.l { stroke: var(--accent); stroke-width: 2.4; }
.dial .face { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.dial .needle { stroke: var(--accent); stroke-width: 3; stroke-linecap: butt; }
.dial .cap { fill: var(--ink); }
.dial text { fill: var(--ink); font-family: var(--font); }
.now h2 { margin: 6px 0 8px; font-size: clamp(24px, 4.5vw, 34px); line-height: 1.1; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
.now p { margin: 0; color: var(--mute); max-width: 52ch; }
.now p b { color: var(--ink); font-weight: 700; }
.bar { height: 6px; background: var(--line); margin-top: 18px; max-width: 360px; }
.bar i { display: block; height: 100%; background: var(--accent); }
@media (max-width: 640px) { .bar { margin-inline: auto; width: 100%; } }

/* ruler */
.ruler-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.ruler { overflow-x: auto; background: var(--panel); padding: 8px 0 4px; scrollbar-width: thin; }
.ruler svg { display: block; width: 960px; height: 118px; }
.ruler .t { stroke: var(--mute); stroke-width: 1; }
.ruler .t5 { stroke: var(--ink); stroke-width: 1.5; }
.ruler text { fill: var(--ink); font-family: var(--font); font-size: 11px; font-weight: 500; }
.ruler .lt { fill: var(--accent-ink); font-weight: 700; }
.ruler .band { fill: var(--accent); }
.ruler .done { fill: var(--ink); }
.ruler .dev { fill: var(--line); }
.ruler .devnow { fill: var(--line); stroke: var(--accent); stroke-width: 2; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 10px; display: inline-block; }
.legend .lk-l { background: var(--accent); }
.legend .lk-d { background: var(--line); }
.ruler .ahead { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.ruler .pointer { stroke: var(--accent); stroke-width: 2; }
.ruler .pointer-dot { fill: var(--accent); }

/* rows */
.leaps { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.leap { display: grid; grid-template-columns: 52px minmax(0, 1fr) 230px; gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--line); align-items: start; }
@media (max-width: 640px) { .leap { grid-template-columns: 44px minmax(0, 1fr); gap: 14px; } .leap .when { grid-column: 2; } }
.knob { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 19px; border: 2px solid var(--ink); font-variant-numeric: tabular-nums; }
@media (max-width: 640px) { .knob { width: 42px; height: 42px; font-size: 17px; } }
.leap.past .knob { background: var(--ink); color: var(--bg); }
.leap.dev .knob { border-color: var(--accent); border-width: 5px; }
.leap.now .knob { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.leap h3 { margin: 0 0 2px; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.leap p { margin: 0; color: var(--mute); max-width: 58ch; }
.leap .skills { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.skills .label { align-self: center; margin-right: 4px; }
.skills span:not(.label) { font-size: 12px; border: 1px solid var(--line); padding: 2px 8px; }
.when { display: grid; gap: 2px; font-size: 13px; }
.when b { font-size: 15px; font-weight: 700; }
.state { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.leap.now .state, .leap.dev .state { color: var(--accent); }
.when .sub { font-weight: 500; color: var(--ink); }
.when .label { margin-top: 6px; }
.when .label:first-child { margin-top: 0; }
.leap.past .state, .leap.next .state, .leap.later .state { color: var(--mute); }
.leap.past h3 { color: var(--mute); }

/* settings */
.settings { display: flex; flex-wrap: wrap; gap: 20px; align-items: end; border-top: 1px solid var(--line); padding-top: 18px; }
.field { display: grid; gap: 6px; }
.field input { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 0; padding: 8px 10px; min-width: 160px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.field select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 0; padding: 8px 10px; min-width: 220px; max-width: 100%; }
.schema-note { flex-basis: 100%; margin: 0; color: var(--mute); font-size: 13px; max-width: 70ch; }
.custom { flex-basis: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 20px; }
.custom .row { display: grid; gap: 4px; }
.custom .pair { display: flex; gap: 6px; align-items: center; }
.custom input { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 0; padding: 6px 8px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
footer { color: var(--mute); font-size: 13px; max-width: 70ch; }
footer p { margin: 0 0 6px; }
</style>

<main class="wrap">
  <header>
    <h1>Sprongenmeter</h1>
    <span class="label">Mentale sprongen · 10 stuks</span>
  </header>

  <section class="specs" aria-label="Gegevens van de baby">
    <div class="spec"><span class="label">Geboren</span><b id="s-born" class="num"></b><small id="s-born-sub"></small></div>
    <div class="spec"><span class="label">Uitgerekend</span><b id="s-due" class="num"></b><small id="s-due-sub"></small></div>
    <div class="spec"><span class="label">Leeftijd</span><b id="s-age" class="num"></b><small id="s-age-sub"></small></div>
    <div class="spec"><span class="label" id="s-corr-label">Sprongleeftijd</span><b id="s-corr" class="num"></b><small id="s-corr-sub"></small></div>
  </section>

  <section class="now" aria-live="polite">
    <svg class="dial" id="dial" viewBox="0 0 220 220" role="img" aria-label="Wijzerplaat met weken na de uitgerekende datum"></svg>
    <div>
      <span class="label" id="n-label"></span>
      <h2 id="n-title"></h2>
      <p id="n-text"></p>
      <div class="bar" id="n-bar" hidden><i id="n-fill"></i></div>
    </div>
  </section>

  <section>
    <div class="ruler-head"><span class="label">Schaal in weken na uitgerekende datum</span><span class="label legend"><span><i class="lk-l"></i>Lastige periode</span><span><i class="lk-d"></i>Ontwikkelingsfase</span></span></div>
    <div class="ruler" id="ruler"></div>
  </section>

  <ol class="leaps" id="leaps"></ol>

  <section class="settings" aria-label="Instellingen">
    <div class="field"><label class="label" for="in-born">Geboortedatum</label><input type="date" id="in-born" value="2026-06-09"></div>
    <div class="field"><label class="label" for="in-due">Uitgerekende datum</label><input type="date" id="in-due" value="2026-06-18"></div>
    <div class="field"><label class="label" for="in-count">Telling</label>
      <select id="in-count">
        <option value="due">Vanaf uitgerekende datum</option>
        <option value="born">Vanaf geboortedatum</option>
      </select></div>
    <div class="field"><label class="label" for="in-schema">Schema van de sprongen</label>
      <select id="in-schema">
        <option value="standaard">Oei, ik groei! (startweken)</option>
        <option value="kort">Kort (vroeg klaar)</option>
        <option value="lang">Lang (vroeg begin, laat klaar)</option>
        <option value="eigen">Eigen weken invullen</option>
      </select></div>
    <p class="schema-note" id="schema-note"></p>
    <div class="custom" id="custom" hidden></div>
  </section>

  <footer>
    <p id="f-note"></p>
    <p>Alle weken en data zijn indicatief. Elke baby wijkt een paar dagen tot een week af.</p>
  </footer>
</main>

<script>
(function () {
  var DAY = 864e5;
  var LEAPS = [
    { n: 1,  w: 5,  e: 6,  name: "Wereld van veranderende sensaties", d: "Baby neemt scherper waar: licht, geluid, geur en aanraking komen bewuster binnen.", s: ["Gericht kijken", "Eerste lachje", "Wakkerder"] },
    { n: 2,  w: 8,  e: 9,  name: "Wereld van patronen", d: "Baby ontdekt herhaling en vormen, zoals de eigen handjes en terugkerende geluiden.", s: ["Handjes ontdekken", "Voorwerpen volgen", "Eerste geluidjes"] },
    { n: 3,  w: 12, e: 13, name: "Wereld van vloeiende overgangen", d: "Bewegingen en geluiden worden vloeiender. Baby maakt vaker en soepeler contact.", s: ["Hoofd omhoog", "Meer klanken", "Bewegen en reiken"] },
    { n: 4,  w: 19, e: 23, name: "Wereld van gebeurtenissen", d: "Baby begrijpt korte reeksen van bewegingen, zoals pakken, rollen en een rammelaar schudden.", s: ["Grijpen", "Rollen", "Brabbelen"] },
    { n: 5,  w: 26, e: 30, name: "Wereld van relaties", d: "Baby ziet afstand en verband tussen dingen: erin, eronder, dichtbij, ver weg.", s: ["Zitten", "Pakken en laten vallen", "Vreemdelen"] },
    { n: 6,  w: 37, e: 41, name: "Wereld van categorieën", d: "Baby gaat dingen groeperen en ziet het verschil tussen bijvoorbeeld dieren, eten en speelgoed.", s: ["Kruipen", "Wijzen", "Dingen benoemen"] },
    { n: 7,  w: 46, e: 51, name: "Wereld van volgordes", d: "Baby snapt dat dingen in een vaste volgorde horen, zoals stapelen en in elkaar passen.", s: ["Staan en lopen", "Stapelen", "Eerste woordjes"] },
    { n: 8,  w: 55, e: 60, name: "Wereld van programma's", d: "Baby begrijpt routines als aankleden en opruimen, en doet volwassenen na.", s: ["Nadoen", "Helpen", "Zelf eten"] },
    { n: 9,  w: 64, e: 69, name: "Wereld van principes", d: "Baby past regels en principes flexibel toe en krijgt een eigen wil.", s: ["Eigen wil", "Kiezen", "Rollenspel"] },
    { n: 10, w: 75, e: 79, name: "Wereld van systemen", d: "Peuter begint zichzelf als persoon te zien, met eigen normen en waarden.", s: ["Zelfbeeld", "Delen", "Samenspelen"] }
  ];
  var MAXW = 80;
  var BW = [5, 8, 12, 19, 26, 37, 46, 55, 64, 75];
  var BE = [6, 9, 13, 23, 30, 41, 51, 60, 69, 79];
  var KORT = [1, 1, 1, 1.5, 2, 2.5, 3, 3, 3, 3];
  var SCHEMAS = {
    standaard: { note: "Startweken zoals bekend uit Oei, ik groei!: week 5, 8, 12, 19, 26, 37, 46, 55, 64 en 75 na de uitgerekende datum. Het einde van de lastige periode is mijn schatting en niet uit het boek gehaald. Bronnen noemen bij sprong 4 meestal 4 tot 5 weken (1 tot 6 mogelijk).", f: function (i) { return [BW[i], BE[i]]; } },
    kort: { note: "Zelfde startweken, maar een kortere onrustige periode: 1 tot 3 weken per sprong. Eigen schatting, geen officiële bron.", f: function (i) { return [BW[i], BW[i] + KORT[i]]; } },
    lang: { note: "Begint een halve week eerder en duurt een week langer dan standaard. Eigen schatting, geen officiële bron.", f: function (i) { return [BW[i] - 0.5, BE[i] + 1]; } },
    eigen: { note: "Vul de weken in die jouw bron noemt. Halve weken mogen (bijvoorbeeld 20.5).", f: function (i) { return custom[i]; } }
  };
  var custom = BW.map(function (w, i) { return [w, BE[i]]; });
  var state0 = { count: "due", schema: "standaard" };
  try {
    var saved = JSON.parse(localStorage.getItem("sprongenmeter") || "null");
    if (saved) { if (saved.count === "born" || saved.count === "due") state0.count = saved.count; if (saved.schema && SCHEMAS[saved.schema]) state0.schema = saved.schema; if (saved.custom && saved.custom.length === 10) custom = saved.custom; }
  } catch (e) {}
  function save() { try { localStorage.setItem("sprongenmeter", JSON.stringify({ count: state0.count, schema: state0.schema, custom: custom })); } catch (e) {} }
  function wk(x) { return String(Math.round(x * 10) / 10).replace(".", ","); }

  var $ = function (id) { return document.getElementById(id); };
  function utc(s) { var p = s.split("-").map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
  function todayUTC() { var d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); }
  var fShort = new Intl.DateTimeFormat("nl-NL", { day: "numeric", month: "short", timeZone: "UTC" });
  var fLong = new Intl.DateTimeFormat("nl-NL", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
  var fDay = new Intl.DateTimeFormat("nl-NL", { weekday: "long", timeZone: "UTC" });
  function wd(days) { var w = Math.floor(days / 7), d = days - w * 7; return w + " wk" + (d ? " " + d + " d" : ""); }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  function dialSVG(week) {
    var cx = 110, cy = 110, r = 98, start = -135, sweep = 270, out = "";
    out += '<circle class="face" cx="' + cx + '" cy="' + cy + '" r="108"/>';
    var leapWeeks = {}; LEAPS.forEach(function (l) { leapWeeks[Math.round(l.w)] = 1; });
    for (var i = 0; i <= MAXW; i++) {
      var a = (start + sweep * i / MAXW - 90) * Math.PI / 180;
      var big = i % 10 === 0, lw = leapWeeks[i];
      var r2 = lw ? r - 13 : big ? r - 12 : r - 7;
      out += '<line class="tick' + (lw ? " l" : big ? " k" : "") + '" x1="' + (cx + r * Math.cos(a)).toFixed(1) + '" y1="' + (cy + r * Math.sin(a)).toFixed(1) + '" x2="' + (cx + r2 * Math.cos(a)).toFixed(1) + '" y2="' + (cy + r2 * Math.sin(a)).toFixed(1) + '"/>';
    }
    var wc = Math.max(0, Math.min(MAXW, week));
    var an = (start + sweep * wc / MAXW - 90) * Math.PI / 180;
    out += '<line class="needle" x1="' + cx + '" y1="' + cy + '" x2="' + (cx + 72 * Math.cos(an)).toFixed(1) + '" y2="' + (cy + 72 * Math.sin(an)).toFixed(1) + '"/>';
    out += '<circle class="cap" cx="' + cx + '" cy="' + cy + '" r="5"/>';
    out += '<text x="' + cx + '" y="160" text-anchor="middle" font-size="34" font-weight="800">' + Math.max(0, Math.floor(week)) + '</text>';
    out += '<text x="' + cx + '" y="178" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.4">WEKEN</text>';
    return out;
  }

  function rulerSVG(weekF, state) {
    var x0 = 30, x1 = 930, W = 960, H = 118, u = (x1 - x0) / MAXW;
    var X = function (w) { return x0 + w * u; };
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Tijdlijn van de tien sprongen">';
    LEAPS.forEach(function (l) {
      var dw = Math.min(l.dw, MAXW);
      if (dw > l.e) out += '<rect class="' + (state[l.n] === "dev" ? "devnow" : "dev") + '" x="' + X(l.e) + '" y="14" width="' + ((dw - l.e) * u) + '" height="30"/>';
      var cls = state[l.n] === "now" ? "band" : (state[l.n] === "past" || state[l.n] === "dev") ? "done" : "ahead";
      out += '<rect class="' + cls + '" x="' + X(l.w) + '" y="14" width="' + ((l.e - l.w) * u) + '" height="30"/>';
      var tcls = state[l.n] === "future" ? "" : ' class="lt"';
      var fill = state[l.n] === "future" ? "" : "";
      out += '<text' + tcls + ' x="' + (X(l.w) + (l.e - l.w) * u / 2) + '" y="34" text-anchor="middle">' + l.n + '</text>';
    });
    for (var i = 0; i <= MAXW; i++) {
      var five = i % 5 === 0;
      out += '<line class="' + (five ? "t5" : "t") + '" x1="' + X(i) + '" x2="' + X(i) + '" y1="56" y2="' + (five ? 80 : 70) + '"/>';
      if (five) out += '<text x="' + X(i) + '" y="96" text-anchor="middle">' + i + '</text>';
    }
    out += '<line class="t5" x1="' + x0 + '" x2="' + x1 + '" y1="56" y2="56"/>';
    if (weekF >= 0) {
      var px = X(Math.min(weekF, MAXW));
      out += '<line class="pointer" x1="' + px + '" x2="' + px + '" y1="6" y2="86"/><circle class="pointer-dot" cx="' + px + '" cy="104" r="5"/>';
    }
    return out + "</svg>";
  }

  function render() {
    var born = utc($("in-born").value), due = utc($("in-due").value), today = todayUTC();
    if (isNaN(born) || isNaN(due)) return;
    var early = Math.round((due - born) / DAY);
    var anchor = state0.count === "born" ? born : due;
    var sch = SCHEMAS[state0.schema];
    LEAPS.forEach(function (l, i) { var t = sch.f(i), w = Number(t[0]), e = Number(t[1]); if (isNaN(w)) w = BW[i]; if (isNaN(e) || e <= w) e = w + 0.5; l.w = w; l.e = e; });
    var ageD = Math.round((today - born) / DAY), corrD = Math.round((today - anchor) / DAY);
    var earlyD = Math.max(0, early);
    $("schema-note").textContent = sch.note;
    $("s-corr-label").textContent = state0.count === "born" ? "Sprongleeftijd (vanaf geboorte)" : "Sprongleeftijd";
    $("s-corr-sub").textContent = state0.count === "born" ? "geteld vanaf geboortedatum" : "geteld vanaf uitgerekend";
    $("f-note").textContent = state0.count === "born"
      ? "Je telt nu vanaf de geboortedatum. Veel bronnen tellen vanaf de uitgerekende datum, dan komt elke sprong " + plural(earlyD, "dag", "dagen") + " later."
      : "De sprongen tellen vanaf de uitgerekende datum, niet vanaf de geboortedatum. Een baby die " + plural(earlyD, "dag", "dagen") + " te vroeg komt, maakt elke sprong dus " + plural(earlyD, "dag", "dagen") + " later door dan de kalenderleeftijd doet vermoeden.";
    var weekF = corrD / 7;

    $("s-born").textContent = fLong.format(born);
    $("s-born-sub").textContent = fDay.format(born);
    $("s-due").textContent = fLong.format(due);
    $("s-due-sub").textContent = early > 0 ? plural(early, "dag", "dagen") + " later dan de geboorte" : early < 0 ? plural(-early, "dag", "dagen") + " te laat geboren" : "op de dag geboren";
    $("s-age").textContent = ageD >= 0 ? wd(ageD) : "nog niet geboren";
    $("s-age-sub").textContent = ageD >= 0 ? plural(ageD, "dag", "dagen") + " sinds de geboorte" : "";
    $("s-corr").textContent = corrD >= 0 ? wd(corrD) : "nog " + plural(-corrD, "dag", "dagen");

    var state = {}, current = null, next = null, dev = null;
    LEAPS.forEach(function (l, i) {
      l.sd = anchor + Math.round(l.w * 7) * DAY; l.ed = anchor + Math.round(l.e * 7) * DAY;
      var nx = LEAPS[i + 1];
      l.dw = nx ? Math.max(l.e, Number(nx.w)) : l.e + 3;
    });
    LEAPS.forEach(function (l, i) {
      var nx = LEAPS[i + 1];
      l.dd = nx ? Math.max(l.ed, anchor + Math.round(nx.w * 7) * DAY) : l.ed + 21 * DAY;
      if (today >= l.dd) state[l.n] = "past";
      else if (today >= l.ed) { state[l.n] = "dev"; dev = l; }
      else if (today >= l.sd) { state[l.n] = "now"; current = l; }
      else { state[l.n] = "future"; if (!next) next = l; }
    });

    $("dial").innerHTML = dialSVG(weekF);
    $("ruler").innerHTML = rulerSVG(weekF, state);

    var lab = $("n-label"), tt = $("n-title"), tx = $("n-text"), bar = $("n-bar");
    bar.hidden = true;
    if (current) {
      var left = Math.round((current.ed - today) / DAY), total = (current.ed - current.sd) / DAY, done = (today - current.sd) / DAY;
      lab.textContent = "Lastige periode";
      tt.textContent = "Sprong " + current.n + ": " + current.name;
      tx.innerHTML = "De lastige periode loopt tot ongeveer <b>" + fShort.format(current.ed) + "</b>, nog " + plural(left, "dag", "dagen") + ". Daarna volgt de ontwikkelingsfase tot ongeveer " + fShort.format(current.dd) + ". " + current.d;
      bar.hidden = false; $("n-fill").style.width = Math.min(100, Math.max(4, done / total * 100)) + "%";
    } else if (dev) {
      var dl = Math.max(0, Math.round((dev.dd - today) / DAY)), dtot = (dev.dd - dev.ed) / DAY, ddone = (today - dev.ed) / DAY;
      lab.textContent = "Ontwikkelingsfase";
      tt.textContent = "Na sprong " + dev.n + ": nieuwe vaardigheden";
      tx.innerHTML = "De lastige periode is voorbij. Tot ongeveer <b>" + fShort.format(dev.dd) + "</b> (nog " + plural(dl, "dag", "dagen") + ") is baby meestal rustiger en laat nieuwe dingen zien: <b>" + dev.s.join(", ").toLowerCase() + "</b>." + (next ? " Sprong " + next.n + " begint over " + plural(Math.round((next.sd - today) / DAY), "dag", "dagen") + "." : "");
      bar.hidden = false; $("n-fill").style.width = Math.min(100, Math.max(4, ddone / dtot * 100)) + "%";
    } else if (next) {
      var days = Math.round((next.sd - today) / DAY);
      lab.textContent = corrD < 0 ? "Nog niet uitgerekend" : "Rustig tussen twee sprongen";
      tt.textContent = "Sprong " + next.n + " start over " + plural(days, "dag", "dagen");
      tx.innerHTML = "Verwacht vanaf <b>" + fShort.format(next.sd) + "</b>: " + next.name.toLowerCase() + ". " + next.d;
    } else {
      lab.textContent = "Klaar";
      tt.textContent = "Alle tien sprongen zijn geweest";
      tx.textContent = "Dit overzicht loopt tot ongeveer 79 weken na de uitgerekende datum.";
    }

    var nextN = next ? next.n : -1;
    $("leaps").innerHTML = LEAPS.map(function (l) {
      var st = state[l.n], cls = st === "future" ? (l.n === nextN ? "next" : "later") : st;
      var txt = st === "past" ? "Voorbij" : st === "now" ? "Lastige periode nu" : st === "dev" ? "Ontwikkelingsfase nu" : l.n === nextN ? "Volgende" : "Straks";
      var soon = l.sd < today ? "" : '<span>over ' + plural(Math.round((l.sd - today) / DAY), "dag", "dagen") + '</span>';
      return '<li class="leap ' + cls + '"><div class="knob">' + l.n + '</div><div><h3>' + l.name + '</h3><p>' + l.d + '</p><div class="skills"><span class="label">Nieuw</span>' +
        l.s.map(function (x) { return "<span>" + x + "</span>"; }).join("") + '</div></div><div class="when num">' +
        '<span class="label">Lastig · wk ' + wk(l.w) + '–' + wk(l.e) + '</span><b>' + fShort.format(l.sd) + ' – ' + fShort.format(l.ed) + '</b>' +
        '<span class="label">Ontwikkeling · wk ' + wk(l.e) + '–' + wk(l.dw) + '</span><b class="sub">' + fShort.format(l.ed) + ' – ' + fShort.format(l.dd) + '</b>' +
        soon + '<span class="state">' + txt + '</span></div></li>';
    }).join("");
  }

  var cust = $("custom");
  cust.innerHTML = custom.map(function (c, i) {
    return '<div class="row"><label class="label" for="cw-' + i + '">Sprong ' + (i + 1) + '</label><div class="pair"><input type="number" step="0.5" min="0" max="120" id="cw-' + i + '" value="' + c[0] + '" aria-label="Start sprong ' + (i + 1) + ' in weken"><span>–</span><input type="number" step="0.5" min="0" max="120" id="ce-' + i + '" value="' + c[1] + '" aria-label="Einde sprong ' + (i + 1) + ' in weken"></div></div>';
  }).join("");
  function syncCustom() { cust.hidden = state0.schema !== "eigen"; }
  custom.forEach(function (c, i) {
    ["cw-", "ce-"].forEach(function (pre, k) {
      $(pre + i).addEventListener("input", function () { var v = parseFloat(this.value); if (!isNaN(v)) { custom[i][k] = v; save(); render(); } });
    });
  });
  $("in-count").value = state0.count; $("in-schema").value = state0.schema; syncCustom();
  $("in-count").addEventListener("change", function () { state0.count = this.value; save(); render(); });
  $("in-schema").addEventListener("change", function () { state0.schema = this.value; syncCustom(); save(); render(); });
  $("in-born").addEventListener("change", render);
  $("in-due").addEventListener("change", render);
  render();

  // Scroll the ruler so the pointer is in view on narrow screens.
  var r = $("ruler"), p = r.querySelector(".pointer");
  if (p && r.scrollWidth > r.clientWidth) {
    r.scrollLeft = Math.max(0, parseFloat(p.getAttribute("x1")) * (r.scrollWidth / 960) - r.clientWidth / 2);
  }
})();
</script>
